<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolmi — Bridge (final)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --display:'Fraunces',Georgia,serif;
  --ui:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="paper"]{
  color-scheme:light;
  --bg:#F2ECDF;--panel:#FBF7EF;--panel2:#F5EFE2;--card:#FFFFFF;
  --ink:#241F17;--mute:#6A6250;--faint:#9A917B;--line:rgba(40,34,22,.10);--line-dash:rgba(40,34,22,.14);
  --ac:#0E8F7E;--ac-ink:#0A6E61;--on-ac:#F4FBF8;--ac-soft:rgba(14,143,126,.10);
  --src:#B06A2C;--src-soft:rgba(176,106,44,.10);
  --sh:0 18px 40px -22px rgba(60,48,24,.45),0 1px 0 rgba(255,255,255,.7) inset;
  --sh-sm:0 10px 24px -16px rgba(60,48,24,.4);
}
:root[data-theme="ink"]{
  color-scheme:dark;
  --bg:#15140E;--panel:#1F1D15;--panel2:#262318;--card:#211F17;
  --ink:#F2ECDE;--mute:#ABA28C;--faint:#776F59;--line:rgba(255,255,255,.08);--line-dash:rgba(255,255,255,.11);
  --ac:#2FB9A4;--ac-ink:#5ED8C4;--on-ac:#06201C;--ac-soft:rgba(47,185,164,.13);
  --src:#E0A05C;--src-soft:rgba(224,160,92,.12);
  --sh:0 22px 46px -24px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.05) inset;
  --sh-sm:0 14px 30px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .4s var(--ease)}
button{cursor:pointer;border:0;background:none;color:inherit;font:inherit}
input,textarea,select{font:inherit;color:inherit}
.ic svg{width:19px;height:19px;stroke-width:1.9}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:10px}

.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);max-width:1260px;margin:0 auto;padding:0 clamp(18px,4vw,48px)}

/* header */
.top{display:flex;align-items:center;gap:18px;padding:22px 2px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:38px;height:38px;border-radius:50%;border:2px solid var(--ac);display:grid;place-items:center;color:var(--ac);transition:.3s}
.mark svg{width:21px;height:21px}
.brand b{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.01em}
.nav{display:flex;gap:1px;margin-left:10px}
.nav button{font-size:14px;font-weight:600;color:var(--mute);padding:8px 14px;border-radius:10px;transition:.2s;position:relative}
.nav button:hover{color:var(--ink)}
.nav button.a{color:var(--ink)}
.nav button.a::after{content:"";position:absolute;left:14px;right:14px;bottom:1px;height:2px;background:var(--ac);border-radius:2px}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--mute);background:var(--panel);border:1px solid var(--line);padding:8px 13px;border-radius:999px}
.chip b{color:var(--ac-ink);font-weight:600}
.chip .de{color:var(--src)}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;padding:9px 16px;border-radius:999px;transition:.2s}
.btn.pri{background:var(--ac);color:var(--on-ac);box-shadow:0 10px 22px -12px var(--ac)}
.btn.pri:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--panel);border:1px solid var(--line)}
.btn.ghost.on{color:var(--ac-ink);border-color:var(--ac)}
.btn.dark{background:var(--ink);color:var(--bg)}

/* views */
.view{display:none;min-height:0}
.view.a{display:flex;flex-direction:column;min-height:0}

/* LIVE */
#v-live.a{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0}
.hero{padding:24px 2px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hero .eye{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.05em}
.hero h1{font-family:var(--display);font-weight:600;font-size:clamp(32px,4vw,50px);line-height:1.02;letter-spacing:-.02em;margin-top:7px;text-wrap:balance}
.hero h1 em{font-style:italic;color:var(--ac-ink)}
.sess{display:flex;gap:22px;font-family:var(--mono);font-size:12.5px;color:var(--mute)}
.sess b{display:block;font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.sess .ac{color:var(--ac-ink)}

.bridge{min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh);overflow:hidden}
.bhead{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);position:relative}
.bhead .h{padding:14px 26px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.bhead .de-h{color:var(--src)}
.bhead .en-h{color:var(--ac-ink)}
.bhead .live-dot{width:7px;height:7px;border-radius:50%;background:var(--faint);margin-left:auto}
.bhead.on .live-dot{background:var(--ac);box-shadow:0 0 0 0 var(--ac);animation:ping 1.6s var(--ease) infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--ac-soft)}70%,100%{box-shadow:0 0 0 7px transparent}}
.knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ac);z-index:3;box-shadow:var(--sh-sm);transition:.3s}
.bhead.on .knob{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.knob svg{width:15px;height:15px}
/* the scroll area; a 1px center line via background keeps the bridge continuous */
.brows{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;
  background:linear-gradient(var(--line),var(--line)) 50% 0/1px 100% no-repeat}
.pair{display:grid;grid-template-columns:1fr 1fr}
.pair .c{padding:15px 26px;border-bottom:1px dashed var(--line-dash)}
.pair .de{color:var(--mute);font-size:15px;line-height:1.5}
.pair .en{font-family:var(--display);font-weight:500;font-size:18px;line-height:1.42}
.pair .ts{display:block;font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:4px}
.pair.cur .c{background:var(--ac-soft)}
.pair.cur .de{color:var(--ink)}
.pair.cur .en{color:var(--ink)}
.brows.hidede .pair{grid-template-columns:1fr}
.brows.hidede .de{display:none}
.bhead.hidede .de-h{display:none}
.pair.cur .de .ts{color:var(--src)}
.caret{display:inline-block;width:6px;height:16px;background:var(--ac);vertical-align:-2px;margin-left:2px;animation:blink .8s infinite}
@keyframes blink{50%{opacity:.3}}
.idle{grid-column:1/-1;margin:auto;text-align:center;color:var(--faint);padding:40px 20px}
.idle .ring{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 14px;color:var(--ac);box-shadow:var(--sh-sm)}
.idle .ring svg{width:26px;height:26px}
.idle .big{font-family:var(--display);font-size:20px;font-weight:600;color:var(--ink);margin-bottom:4px}

/* control strip */
.strip{display:flex;align-items:center;gap:16px;padding:16px 2px 22px}
.go{width:56px;height:56px;border-radius:50%;background:var(--ac);color:var(--on-ac);display:grid;place-items:center;box-shadow:0 14px 28px -10px var(--ac);transition:transform .2s var(--ease)}
.go:hover{transform:scale(1.06)}.go:active{transform:scale(.95)}
.go .ic svg{width:23px;height:23px}
.track{flex:1;height:42px;border-radius:999px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;gap:3px;padding:0 18px;overflow:hidden}
.track i{flex:1;height:22px;border-radius:2px;background:var(--line-dash);transform-origin:center;transform:scaleY(.2)}
.track.on i{background:var(--faint)}.track.on i.hot{background:var(--ac)}
.strip .status{font-family:var(--mono);font-size:12.5px;color:var(--mute);white-space:nowrap;text-align:right;min-width:150px}
.strip .status b{color:var(--ac-ink);display:block}
