<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolmi overlay</title>
<link href="vendor/fonts.css" rel="stylesheet">
<style>
:root{--a:.88;--fs:22px;--ac:#2FB9A4;--src:#E0A05C;--mono:'JetBrains Mono',ui-monospace,monospace;--display:'Fraunces',Georgia,serif;--ui:'Hanken Grotesk',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{height:100%;background:transparent;overflow:hidden;font-family:var(--ui)}
.hud{height:100%;background:rgba(22,21,15,var(--a));border:1px solid rgba(255,255,255,.08);border-radius:18px;
  box-shadow:0 10px 36px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden;color:#F2ECDE}
.bar{display:flex;align-items:center;gap:8px;padding:9px 12px 5px;cursor:move;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ac)}
.pulse{animation:p 1.6s ease-in-out infinite}@keyframes p{0%,100%{opacity:.4}50%{opacity:1}}
.nm{font-size:12px;color:#9a917b;font-weight:600;font-family:var(--mono)}
.sp{flex:1}
.x{width:26px;height:22px;display:grid;place-items:center;border-radius:6px;color:#9a917b;font-size:13px;font-weight:700;cursor:pointer}
.x:hover{background:rgba(255,255,255,.08);color:#fff}
.body{flex:1;overflow:auto;padding:4px 18px 16px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.de{font-family:var(--mono);font-size:13px;color:#aba28c;line-height:1.4}
.en{font-family:var(--display);font-weight:500;font-size:var(--fs);line-height:1.3;color:#F6F1E7}
.idle{color:#776f59;font-size:14px}
.grip{position:fixed;right:3px;bottom:3px;width:16px;height:16px;cursor:nwse-resize;opacity:.5}
.grip:before{content:"";position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-right:2px solid #9a917b;border-bottom:2px solid #9a917b;border-radius:0 0 3px 0}
</style>
</head>
<body>
<div class="hud">
  <div class="bar pywebview-drag-region" id="dragbar"><span class="dot pulse" id="dot"></span><span class="nm">Dolmi</span><span class="sp"></span><span class="x" id="close" title="Hide">✕</span></div>
  <div class="body" id="body"><div class="idle" id="idle">Listening…</div></div>
  <div class="grip" id="grip"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const api=()=>window.pywebview&&window.pywebview.api;
const esc=s=>(''+s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const body=$('#body');
function clearIdle(){ const i=$('#idle'); if(i) i.remove(); }
window.ov={
  style:(a,fs)=>{ document.documentElement.style.setProperty('--a',Math.max(.15,Math.min(1,a))); document.documentElement.style.setProperty('--fs',fs+'px'); },
  idle:(t)=>{ body.innerHTML='<div class="idle">'+esc(t||'Listening…')+'</div>'; },
  line:(de,en)=>{ clearIdle(); const d=document.createElement('div'); d.innerHTML='<div class="de">'+esc(de)+'</div><div class="en">'+esc(en)+'</div>'; body.append(d); while(body.children.length>4) body.firstChild.remove(); body.scrollTop=body.scrollHeight; },
  draft:(de,en)=>{ clearIdle(); let dr=document.getElementById('draft'); if(!de&&!en){ if(dr)dr.remove(); return; } if(!dr){ dr=document.createElement('div'); dr.id='draft'; dr.style.opacity='.65'; body.append(dr); } dr.innerHTML='<div class="de">'+esc(de)+'</div><div class="en">'+esc(en)+'</div>'; body.scrollTop=body.scrollHeight; },
};
$('#close').onclick=()=>{ const a=api(); if(a&&a.hide) a.hide(); };
/* drag: the bar is a native pywebview drag region (DPI-correct). resize: the grip, in logical
   pixels, one resize in flight at a time so fast mouse moves don't pile up round-trips */
$('#close').addEventListener('mousedown',e=>e.stopPropagation());
let rz=null,busy=false,pending=null;
function pushResize(){ if(busy||!pending)return; const a=api(); if(!a)return; const p=pending; pending=null; busy=true; a.resize(p.w,p.h).finally(()=>{busy=false;pushResize();}); }
$('#grip').addEventListener('mousedown',e=>{ e.preventDefault(); e.stopPropagation(); const a=api(); if(!a)return; rz={sx:e.screenX,sy:e.screenY}; a.geometry().then(g=>{ if(rz) rz.g=g; }); });
window.addEventListener('mousemove',e=>{ if(!rz||!rz.g)return; pending={w:rz.g.w+(e.screenX-rz.sx),h:rz.g.h+(e.screenY-rz.sy)}; pushResize(); });
window.addEventListener('mouseup',()=>rz=null);
</script>
</body>
</html>
